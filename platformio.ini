; PlatformIO build of the gateway firmware: the main build, flash and release
; tool (tools/release.ps1). idf.py is a fallback; both read sdkconfig.defaults
; and partitions.csv. tools/ppp_smoke and
; tools/at_bridge are idf.py only.
[platformio]
src_dir = main
default_envs = gateway

[env:gateway]
; 7.1.0 bundles ESP-IDF v6.1.0 (pioarduino is still on IDF 5.5). Pin exactly.
platform = espressif32 @ 7.1.0
framework = espidf
board = esp32dev
; Flash settings mirror sdkconfig.defaults (16 MB, QIO, 80 MHz, 240 MHz CPU).
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
extra_scripts = post:sign_ota.py
upload_port = COM6
upload_speed = 921600
monitor_port = COM6
monitor_speed = 115200
