# Build the gateway firmware with PlatformIO on every PR, so a broken build
# shows before merge. A throwaway RSA-3072 key stands in for the real OTA
# signing key (keys/ is gitignored and the real key never leaves the owner's
# PC): the image is built and signed the same way, but cannot be installed.
# Kept out of rmx.yml, which must match the shared caller template.
# The push run saves the PlatformIO cache on development: a PR can only read
# caches from its own ref and its base branch, so without it every PR starts
# cold (~15 min instead of a few).
name: build

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
    paths:
      - 'main/**'
      - 'certs/**'
      - 'CMakeLists.txt'
      - 'platformio.ini'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
      - 'sign_ota.py'
      - 'version.txt'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PlatformIO packages cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'main/idf_component.yml') }}

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Throwaway signing key
        run: mkdir -p keys && openssl genrsa -out keys/ota_signing_key.pem 3072

      - name: Build (gateway env)
        run: pio run -e gateway

      - name: Image size
        run: ls -l .pio/build/gateway/firmware.bin
